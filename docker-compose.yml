services:
  pricemonitorprinzipwebapi:
    build:
      context: ./PriceMonitorPrinzipWebApi                  
      dockerfile: Dockerfile      
    container_name: price-monitor-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/price_monitor.db
      - EmailSettings__SmtpHost=${SMTP_HOST:-smtp.mail.ru}
      - EmailSettings__SmtpPort=${SMTP_PORT:-465}
      - EmailSettings__SmtpUser=${SMTP_USER:-}
      - EmailSettings__SmtpPass=${SMTP_PASS:-}
    volumes:
      - ./data:/app/data        
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
